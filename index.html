<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
    <title>El Pollo Loco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link href="style.css" rel="stylesheet">
    <link rel="preload" href="js/game.js" as="script">
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="./models/character.class.js" as="script">
    <script src="./models/drawable-object.class.js" defer></script>
    <script src="./models/audiomanager.class.js" defer></script>
    <script src="./models/bottle.class.js" defer></script>
    <script src="./models/movable-object.class.js" defer></script>
    <script src="./models/character.class.js" defer></script>
    <script src="./models/chicken.class.js" defer></script>
    <script src="./models/chicken.small.class.js" defer></script>
    <script src="./models/status-bar-flask.class.js" defer></script>
    <script src="./models/status-bar-coin.class.js" defer></script>
    <script src="./models/status-bar.class.js" defer></script>
    <script src="./models/clouds.class.js" defer></script>
    <script src="./models/background-object.class.js" defer></script>
    <script src="./models/keyboard.class.js" defer></script>
    <script src="./models/level.class.js" defer></script>
    <script src="./models/throwable-object.class.js" defer></script>
    <script src="./models/heart.class.js" defer></script>
    <script src="./models/coin.class.js" defer></script>
    <script src="./models/endboss.class.js" defer></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./models/world.class.js" defer></script>
    <script src="./models/menu.class.js" defer></script>
    <script src="./models/menu-models/tutorial.class.js" defer></script>
    <script src="./models/menu-models/impressum.class.js" defer></script>
    <script src="./js/game.js" defer></script>
    <script src="./models/menu-models/end.class.js" defer></script>
    <script src="./models/phonekeys.class.js" defer></script>
</head>

<body onload="init()">
<h1 id="h1overview">El pollo loco</h1>

<div id="game-container">
    <canvas id="canvas" width="720" height="480"></canvas>

    <div id="mobile-controls">
        <div class="left-controls" id="left-controls">
            <button id="btn-left" oncontextmenu="return false"><img src="img/arrow-left.svg"></button>
            <button id="btn-up" oncontextmenu="return false"><img src="img/arrow-up.svg"></button>
            <button id="btn-right" oncontextmenu="return false"><img src="img/arrow-right.svg"></button>
        </div>

        <div class="right-controls" id="right-controls">
            <button id="btn-space" oncontextmenu="return false"><img src="img/space-key.svg"></button>
        </div>

        <div class="top-controls" id="top-controls">
            <button id="btn-sound" oncontextmenu="return false">
                <img id="img-sound" src="img/sound-max.svg">
            </button>
            <button id="btn-fullscreen" oncontextmenu="return false">
                <img id="img-fullscreen" src="img/fullscreen.svg">
            </button>
        </div>
    </div>
</div>
    <div id="loadingscreen"></div>
</body>

</html>
